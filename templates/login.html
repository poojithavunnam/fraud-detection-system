<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Banking Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <div style="margin-bottom: 2rem;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        
        <h2>Bank Analytics</h2>
        <p>Enter your credentials to access the fraud detection dashboard.</p>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" placeholder="name@bank.com">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••">
        </div>

        <button class="btn-primary" onclick="handleLogin()">Sign In</button>

        <p id="msg" style="margin-top: 1.5rem;"></p>
    </div>
</div>

<script>
async function handleLogin() {
    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const msgEl = document.getElementById("msg");

    if(!emailEl.value || !passwordEl.value) {
        msgEl.style.color = "var(--danger)";
        msgEl.innerText = "Please fill in all fields.";
        return;
    }

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({
                email: emailEl.value,
                password: passwordEl.value
            })
        });

        const data = await response.json();

        if(response.ok){
            msgEl.style.color = "var(--success)";
            msgEl.innerText = "Login successful! Redirecting...";
            setTimeout(() => {
                window.location.href = "/dashboard";
            }, 1000);
        } else {
            msgEl.style.color = "var(--danger)";
            msgEl.innerText = data.error || "Login failed. Please try again.";
        }
    } catch (error) {
        msgEl.style.color = "var(--danger)";
        msgEl.innerText = "An error occurred. Please check your connection.";
    }
}

// Allow Enter key to submit
document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleLogin();
});
</script>

</body>
</html>
